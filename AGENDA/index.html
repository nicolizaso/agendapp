<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Agenda Personal</title>
    
    <link href="./vanilla-js-calendar.min.css" rel="stylesheet">

    <style>
        body { font-family: sans-serif; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        #seccion-notas, #seccion-calendario, #seccion-tareas { border: 1px solid #ccc; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mi Agenda</h1>
        
        <form id="form-tarjeta">
            <h2>Crear Nueva Tarjeta</h2>
            <input type="text" id="titulo-tarjeta" placeholder="Título..." required>
            <textarea id="descripcion-tarjeta" placeholder="Descripción..."></textarea>
            <select id="tipo-tarjeta">
                <option value="nota">Nota</option>
                <option value="tarea">Tarea</option>
                <option value="evento">Evento</option>
            </select>
            <input type="date" id="fecha-evento">
            <button type="submit">Guardar Tarjeta</button>
        </form>

        <div id="seccion-notas">
            <h2>Mis Notas</h2>
            <div id="lista-notas"></div>
        </div>

        <div id="seccion-tareas">
            <h2>Mis Tareas</h2>
            <div id="lista-tareas"></div>
        </div>

        <div id="seccion-calendario">
            <h2>Calendario</h2>
            <div id="calendario"></div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>

    <script src="./vanilla-js-calendar.min.js"></script>

    <script type="module" src="app.js"></script>
    
</body>
</html>
