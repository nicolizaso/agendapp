<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Agenda Personal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. Variables Globales y Reseteo --- */
        :root {
            --primary-color: #800020; /* Bordó */
            --secondary-color: #87CEEB; /* Azul Celeste */
            --text-color: #333;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #ddd;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --success-color: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* --- 2. Estructura Principal --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 0 0 10px 10px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-weight: 700;
        }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        /* Estilo general de las secciones */
        section {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        section h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        /* Contenedor para título y botón */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }


        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #888;
            font-size: 0.9em;
        }

        /* --- 3. Componentes Reutilizables (Botones, Formularios) --- */
        .btn {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--secondary-color);
            color: #003366;
        }
        .btn-primary:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
        
        .btn-danger {
            background-color: #fbebee;
            color: #c53030;
        }
        .btn-danger:hover {
            background-color: #c53030;
            color: white;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background-color: #cbd5e0;
        }

        /* Estilos de Formulario */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
        }
        textarea.form-control {
            min-height: 80px;
            resize: vertical;
        }
        .form-radios {
            display: flex;
            gap: 15px;
        }

        /* --- 4. Sección Tareas del Día y Tareas Pendientes --- */
        #task-list, #pending-tasks-list {
            margin-top: 20px;
            display: grid;
            gap: 15px;
        }
        .task-item {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--secondary-color); 
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-left-color 0.3s ease; 
        }
        .task-item[data-type="Evento"] {
            border-left-color: var(--primary-color); 
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-title {
            font-weight: 700;
            font-size: 1.1em;
        }
        .task-time {
            font-weight: 500;
            color: var(--primary-color);
        }
        .task-details span {
            display: block;
            font-size: 0.9em;
            color: #555;
        }
        .task-actions {
            display: flex;
            gap: 10px;
            align-self: flex-end;
        }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            padding: 5px 8px;
            border-radius: 4px;
        }

        /* --- 5. Sección Calendario Mensual --- */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #month-year {
            font-size: 1.3em;
            font-weight: 700;
        }
        .calendar-grid-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border: 1px solid var(--border-color);
            border-top: none; 
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }
        .calendar-day, .calendar-header-day {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }
        .calendar-header-day {
            font-weight: 700;
            background-color: var(--bg-color);
        }
        .calendar-day {
            min-height: 80px;
            text-align: left;
            padding: 8px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .calendar-day:nth-child(7n) { border-right: none; }
        .calendar-day.other-month {
            color: #aaa;
            background-color: #fdfdfd;
        }
        .calendar-day:hover {
            background-color: #e6f7ff;
        }
        .calendar-day.selected {
            background-color: #d0f0ff;
            font-weight: bold;
        }
        .day-number {
            font-size: 0.9em;
        }
        
        /* Estilos para múltiples puntos de calendario */
        .day-indicator-container {
            display: flex;
            flex-wrap: wrap;
            gap: 3px; 
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px; 
        }
        .day-indicator-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background-color: var(--primary-color); 
        }
        
        /* --- 6. Sección Menú Semanal --- */
        .food-calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .food-day {
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 15px;
        }
        .food-day-header {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }
        .food-slot {
            margin-bottom: 10px;
        }
        .food-slot strong {
            font-size: 0.9em;
            color: #555;
        }
        .food-item {
            font-size: 0.95em;
            background: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #c53030;
            cursor: pointer;
            font-size: 1.1em;
            padding: 2px;
            line-height: 1;
        }

        /* --- 7. Estilos Objetivos Semanales --- */
        #objective-list {
            margin-top: 20px;
            display: grid;
            gap: 12px;
        }
        .objective-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            padding: 12px 15px;
            border-radius: 8px;
        }
        .objective-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--secondary-color);
            border-radius: 4px;
            margin-right: 12px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }
        .objective-item input[type="checkbox"]:checked {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        .objective-item input[type="checkbox"]:checked::after {
            content: '\2713'; 
            font-size: 14px;
            color: var(--primary-color);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
        }
        .objective-text {
            flex-grow: 1;
            font-size: 1.05em;
            transition: all 0.2s;
        }
        .objective-text.completed {
            text-decoration: line-through;
            color: #888;
            opacity: 0.8;
        }

        /* --- 8. Modales (Pop-ups) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            margin: 0;
            color: var(--primary-color);
        }
        .modal-header .close-modal-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }
        .modal-footer {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .hidden-field {
            display: none;
        }

        /* Estilos para Etiquetas (Tags) */
        #task-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .tag-pill {
            font-size: 0.85em;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 12px;
            background-color: #eee;
            color: #333;
            display: flex;
            align-items: center;
        }
        .tag-pill-remove {
            margin-left: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            color: #888;
        }
        .tag-pill-remove:hover {
            color: #000;
        }
        .task-tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }
        
        /* --- 9. Responsividad --- */
        
        /* MODIFICADO: Nuevas reglas de layout para escritorio */
        @media (min-width: 768px) {
            main {
                grid-template-columns: 1fr 1fr; /* 2 columnas */
            }
            
            /* Columna 1: Tareas, Objetivos, Pendientes */
            #daily-tasks, #weekly-objectives, #pending-tasks { 
                grid-column: 1 / 2;
            }
            
            /* Columna 2: Calendario */
            #monthly-calendar {
                grid-column: 2 / 3;
                grid-row: 1 / span 3; /* Abarca 3 filas (Tareas, Objetivos, Pendientes) */
                align-self: start;
            }
            
            /* Fila Full-Width: Menú Semanal */
            #food-calendar {
                grid-column: 1 / -1; /* Ocupa ambas columnas */
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            section {
                padding: 15px;
            }
            .btn {
                padding: 10px 15px;
            }
            .calendar-day {
                min-height: 50px;
                font-size: 0.8em;
                padding: 5px;
            }
            .calendar-header-day {
                padding: 5px;
                font-size: 0.8em;
            }
            .day-indicator-container {
                gap: 2px;
                bottom: 4px;
                left: 4px;
                right: 4px;
            }
            .day-indicator-dot {
                width: 5px;
                height: 5px;
            }
        }

    </style>
</head>
<body>

    <header>
        <h1>Mi Agenda Personal</h1>
    </header>

    <div class="container">
        <main>
            
            <section id="daily-tasks">
                <div class="section-header">
                    <h2 id="daily-tasks-title">Tareas para Hoy</h2>
                    <button class="btn btn-primary" id="open-task-modal-btn">Agregar Tarea/Evento</button>
                </div>
                <div id="task-list">
                    </div>
            </section>
            
            <section id="weekly-objectives">
                <div class="section-header">
                    <h2>Objetivos Semanales</h2>
                    <button class="btn btn-primary" id="open-objective-modal-btn">Agregar Objetivo</button>
                </div>
                <div id="objective-list">
                    </div>
            </section>

            <section id="pending-tasks">
                <div class="section-header">
                    <h2>Tareas Pendientes (a futuro)</h2>
                </div>
                <div id="pending-tasks-list">
                    </div>
            </section>
            
            <section id="monthly-calendar">
                <h2>Calendario Mensual</h2>
                <div class="calendar-nav">
                    <button class="btn btn-secondary" id="prev-month-btn">&lt; Ant</button>
                    <span id="month-year">Noviembre 2025</span>
                    <button class="btn btn-secondary" id="next-month-btn">Sig &gt;</button>
                </div>
                <div class="calendar-grid-header">
                    <div class="calendar-header-day">Dom</div>
                    <div class="calendar-header-day">Lun</div>
                    <div class="calendar-header-day">Mar</div>
                    <div class="calendar-header-day">Mié</div>
                    <div class="calendar-header-day">Jue</div>
                    <div class="calendar-header-day">Vie</div>
                    <div class="calendar-header-day">Sáb</div>
                </div>
                <div class="calendar-grid" id="calendar-grid-body">
                    </div>
            </section>

            <section id="food-calendar">
                <div class="section-header">
                    <h2>Mi Menú Semanal</h2>
                    <button class="btn btn-primary" id="open-food-modal-btn">Cargar Comida</button>
                </div>
                <div class="food-calendar-grid" id="food-calendar-grid">
                    </div>
            </section>
            
        </main>
    </div>

    <footer>
        <p>&copy; 2025 Mi Agenda Personal. Creado con HTML, CSS y JS.</p>
    </footer>

    <div class="modal-overlay" id="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="task-modal-title">Añade un título</h3>
                <button class="close-modal-btn" data-modal-id="task-modal">&times;</button>
            </div>
            
            <form id="task-form">
                <input type="hidden" id="task-id" value="">
                
                <div class="form-group">
                    <label for="task-title">Título</label>
                    <input type="text" id="task-title" class="form-control" placeholder="Ej: Reunión de equipo" required>
                </div>
                
                <div class="form-group">
                    <label for="task-tag-input">Etiquetas</label>
                    <div id="task-tags-container">
                        </div>
                    <input type="text" id="task-tag-input" class="form-control" 
                           placeholder="Escribe una etiqueta y presiona Enter" list="existing-tags-datalist">
                    <datalist id="existing-tags-datalist">
                        <option value="personal"></option>
                        <option value="salud"></option>
                        <option value="cultivo"></option>
                        <option value="trabajo"></option>
                        <option value="facultad"></option>
                    </datalist>
                </div>

                <div class="form-group">
                    <label>Tipo</label>
                    <div class="form-radios">
                        <label><input type="radio" name="task-type" value="Tarea" checked> Tarea</label>
                        <label><input type="radio" name="task-type" value="Evento"> Evento</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="task-date">Fecha</label>
                    <input type="date" id="task-date" class="form-control">
                </div>
                
                <div class="form-group">
                    <label for="task-time">Hora</label>
                    <input type="time" id="task-time" class="form-control">
                </div>

                <div class="form-group" id="task-location-group" class="hidden-field">
                    <label for="task-location">Ubicación (opcional)</label>
                    <input type="text" id="task-location" class="form-control" placeholder="Ej: Oficina 301">
                </div>
                
                <div class="form-group">
                    <label for="task-description">Descripción (opcional)</label>
                    <textarea id="task-description" class="form-control" placeholder="Detalles..."></textarea>
                </div>

                <div class="form-group">
                    <label><input type="checkbox" id="task-repeat-check"> Se repite</label>
                </div>
                
                <div class="form-group hidden-field" id="task-repeat-options-group">
                    <label for="task-repeat-frequency">Frecuencia</label>
                    <select id="task-repeat-frequency" class="form-control">
                        <option value="none">No repetir</option>
                        <option value="daily">Diaria</option>
                        <option value="weekly">Semanal</option>
                        <option value="monthly">Mensual</option>
                        <option value="annual">Anual</option>
                    </select>
                    
                    <div class="form-group" style="margin-top: 15px;">
                        <label for="repeat-duration-number">Repetir durante</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="number" id="repeat-duration-number" class="form-control" value="1" min="1" style="flex: 1;">
                            <select id="repeat-duration-unit" class="form-control" style="flex: 2;">
                                <option value="días">días</option>
                                <option value="semanas">semanas</option>
                                <option value="meses">meses</option>
                                <option value="años">años</option>
                            </select>
                        </div>
                    </div>
                </div>


                <div class="modal-footer">
                    <button type="button" class="btn btn-danger close-modal-btn" data-modal-id="task-modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="modal-overlay" id="food-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Planificar Comida</h3>
                <button class="close-modal-btn" data-modal-id="food-modal">&times;</button>
            </div>
            
            <form id="food-form">
                <div class="form-group">
                    <label for="food-name">Comida</label>
                    <input type="text" id="food-name" class="form-control" placeholder="Ej: Pollo con ensalada" required>
                </div>
                <div class="form-group">
                    <label for="food-date">Fecha</label>
                    <input type="date" id="food-date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="food-meal-type">Momento</label>
                    <select id="food-meal-type" class="form-control" required>
                        <option value="Almuerzo">Almuerzo</option>
                        <option value="Cena">Cena</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger close-modal-btn" data-modal-id="food-modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="modal-overlay" id="objective-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nuevo Objetivo Semanal</h3>
                <button class="close-modal-btn" data-modal-id="objective-modal">&times;</button>
            </div>
            
            <form id="objective-form">
                <div class="form-group">
                    <label for="objective-name">Objetivo</label>
                    <input type="text" id="objective-name" class="form-control" placeholder="Ej: Terminar el reporte" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger close-modal-btn" data-modal-id="objective-modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- 1. Estado de la Aplicación y Constantes ---
            let tasks = [];
            let foodPlan = [];
            let objectives = [];

            let currentDate = new Date(); 
            let selectedDate = new Date(); 
            selectedDate.setHours(0, 0, 0, 0);

            const TAG_COLORS = {
                'personal': '#FFAB91', // Salmón
                'salud': '#A5D6A7',    // Verde
                'cultivo': '#81D4FA',  // Azul
                'trabajo': '#B39DDB',  // Violeta
                'facultad': '#F48FB1', // Rosa
            };
            const DEFAULT_TAG_COLORS = ['#CFD8DC', '#FFE082', '#BCAAA4']; // Gris, Amarillo, Marrón
            
            let selectedTags = new Set();

            // --- 2. Selectores del DOM ---
            const taskModal = document.getElementById('task-modal');
            const foodModal = document.getElementById('food-modal');
            const objectiveModal = document.getElementById('objective-modal');
            const openTaskModalBtn = document.getElementById('open-task-modal-btn');
            const openFoodModalBtn = document.getElementById('open-food-modal-btn');
            const openObjectiveModalBtn = document.getElementById('open-objective-modal-btn');
            const closeModalBtns = document.querySelectorAll('.close-modal-btn');
            const modalOverlays = document.querySelectorAll('.modal-overlay');

            const taskForm = document.getElementById('task-form');
            const foodForm = document.getElementById('food-form');
            const objectiveForm = document.getElementById('objective-form');

            const taskListContainer = document.getElementById('task-list');
            const dailyTasksTitle = document.getElementById('daily-tasks-title');
            
            const monthYearDisplay = document.getElementById('month-year');
            const calendarGridBody = document.getElementById('calendar-grid-body');
            const prevMonthBtn = document.getElementById('prev-month-btn');
            const nextMonthBtn = document.getElementById('next-month-btn');

            const foodGridContainer = document.getElementById('food-calendar-grid');
            const objectiveListContainer = document.getElementById('objective-list');
            
            // MODIFICADO: Selector para lista de tareas pendientes
            const pendingTasksListContainer = document.getElementById('pending-tasks-list');
            
            const taskTypeRadios = document.querySelectorAll('input[name="task-type"]');
            const locationGroup = document.getElementById('task-location-group');
            const repeatCheck = document.getElementById('task-repeat-check');
            const repeatOptionsGroup = document.getElementById('task-repeat-options-group');
            
            const tagInput = document.getElementById('task-tag-input');
            const tagsContainer = document.getElementById('task-tags-container');
            
            const taskDateInput = document.getElementById('task-date');
            const taskTimeInput = document.getElementById('task-time');
            

            // --- 3. Listeners de Firebase (en tiempo real) ---

            function listenForTasks() {
                db.collection("tasks").onSnapshot((querySnapshot) => {
                    const newTasks = [];
                    querySnapshot.forEach((doc) => {
                        newTasks.push({ id: doc.id, ...doc.data() });
                    });
                    tasks = newTasks; 
                    
                    renderDailyTasks();
                    renderMonthlyCalendar();
                    renderPendingTasks(); // MODIFICADO: Llama al nuevo render
                    
                }, (error) => console.error("Error al escuchar las tareas: ", error));
            }
            
            function listenForFood() {
                db.collection("foodPlan").onSnapshot((querySnapshot) => {
                    const newFoodPlan = [];
                    querySnapshot.forEach((doc) => {
                        newFoodPlan.push({ id: doc.id, ...doc.data() });
                    });
                    foodPlan = newFoodPlan;
                    renderFoodCalendar();
                }, (error) => console.error("Error al escuchar el plan de comidas: ", error));
            }
            
            function listenForObjectives() {
                const currentWeekId = getWeekId(new Date());
                db.collection("objectives")
                  .where("weekId", "==", currentWeekId)
                  .onSnapshot((querySnapshot) => {
                    const newObjectives = [];
                    querySnapshot.forEach((doc) => {
                        newObjectives.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    objectives = newObjectives;
                    renderWeeklyObjectives();
                }, (error) => console.error("Error al escuchar los objetivos: ", error));
            }

            // --- 4. Funciones de Renderizado ---

            /**
             * MODIFICADO: Renderiza tareas, CON COLOR DE BORDE POR ETIQUETA
             */
            function renderDailyTasks() {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                dailyTasksTitle.textContent = (selectedDate.getTime() === today.getTime()) 
                    ? 'Tareas para Hoy'
                    : `Tareas para ${selectedDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}`;
                
                // MODIFICADO: Filtra tareas CON fecha
                const selectedDateString = toISODateString(selectedDate);
                const tasksForDay = tasks.filter(task => task.date === selectedDateString)
                                        .sort((a, b) => a.time.localeCompare(b.time));

                taskListContainer.innerHTML = ''; 

                if (tasksForDay.length === 0) {
                    taskListContainer.innerHTML = '<p>No hay tareas para este día.</p>';
                    return;
                }

                tasksForDay.forEach(task => {
                    taskListContainer.appendChild(createTaskCard(task)); // Usa la función helper
                });
            }

            /**
             * Renderiza el calendario mensual
             */
            function renderMonthlyCalendar() {
                currentDate.setDate(1); 
                const month = currentDate.getMonth();
                const year = currentDate.getFullYear();
                monthYearDisplay.textContent = `${currentDate.toLocaleDateString('es-ES', { month: 'long' })} ${year}`;
                const firstDayIndex = currentDate.getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const prevLastDay = new Date(year, month, 0).getDate(); 
                calendarGridBody.innerHTML = ''; 
                for (let i = firstDayIndex; i > 0; i--) {
                    const day = prevLastDay - i + 1;
                    const date = new Date(year, month - 1, day);
                    calendarGridBody.appendChild(createCalendarDay(day, date, true));
                }
                for (let i = 1; i <= daysInMonth; i++) {
                    const date = new Date(year, month, i);
                    calendarGridBody.appendChild(createCalendarDay(i, date, false));
                }
                const lastDayIndex = new Date(year, month, daysInMonth).getDay();
                const nextDays = 7 - lastDayIndex - 1;
                for (let i = 1; i <= nextDays; i++) {
                    const date = new Date(year, month + 1, i);
                    calendarGridBody.appendChild(createCalendarDay(i, date, true));
                }
            }

            /**
             * MODIFICADO: Helper para crear celda de día (con múltiples puntos de color)
             */
            function createCalendarDay(dayNumber, date, isOtherMonth) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('calendar-day');
                dayEl.innerHTML = `<span class="day-number">${dayNumber}</span>`;
                const dateString = toISODateString(date);
                if (isOtherMonth) {
                    dayEl.classList.add('other-month');
                }
                if (!isOtherMonth && date.getTime() === selectedDate.getTime()) {
                    dayEl.classList.add('selected');
                }
                
                // MODIFICADO: Lógica para múltiples puntos de color
                const tasksForDay = tasks.filter(task => task.date === dateString);
                
                if (tasksForDay.length > 0 && !isOtherMonth) {
                    const container = document.createElement('div');
                    container.className = 'day-indicator-container';
                    
                    tasksForDay.slice(0, 5).forEach(task => { // Limita a 5 puntos
                        const dot = document.createElement('div');
                        dot.className = 'day-indicator-dot';
                        
                        let dotColor = 'var(--primary-color)'; 
                        if (task.tags && task.tags.length > 0) {
                            dotColor = getTagColor(task.tags[0]);
                        } else if (task.type === 'Tarea') {
                            dotColor = 'var(--secondary-color)';
                        }
                        dot.style.backgroundColor = dotColor;
                        container.appendChild(dot);
                    });
                    
                    dayEl.appendChild(container);
                }
                
                dayEl.addEventListener('click', () => {
                    selectedDate = date;
                    selectedDate.setHours(0, 0, 0, 0);
                    renderDailyTasks(); 
                    renderMonthlyCalendar();
                });
                return dayEl;
            }

            /**
             * Renderiza el menú semanal (Sin cambios)
             */
            function renderFoodCalendar() {
                foodGridContainer.innerHTML = '';
                const today = new Date();
                const dayOfWeek = today.getDay(); 
                const daysOfWeekNames = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                const startDate = new Date(today);
                startDate.setDate(today.getDate() - dayOfWeek);

                for (let i = 0; i < 7; i++) {
                    const currentDay = new Date(startDate);
                    currentDay.setDate(startDate.getDate() + i);
                    const dateString = toISODateString(currentDay);
                    const dayEl = document.createElement('div');
                    dayEl.classList.add('food-day');
                    const foodForDay = foodPlan.filter(food => food.date === dateString);
                    const almuerzo = foodForDay.find(f => f.mealType === 'Almuerzo');
                    const cena = foodForDay.find(f => f.mealType === 'Cena');
                    dayEl.innerHTML = `
                        <div class="food-day-header">${daysOfWeekNames[i]} (${currentDay.getDate()}/${currentDay.getMonth()+1})</div>
                        <div class="food-slot">
                            <strong>Almuerzo:</strong>
                            ${almuerzo ? createFoodItemHTML(almuerzo) : '<p><small>No planificado</small></p>'}
                        </div>
                        <div class="food-slot">
                            <strong>Cena:</strong>
                            ${cena ? createFoodItemHTML(cena) : '<p><small>No planificado</small></p>'}
                        </div>
                    `;
                    foodGridContainer.appendChild(dayEl);
                }
            }

            function createFoodItemHTML(food) {
                return `
                    <div class="food-item">
                        <span>${escapeHTML(food.name)}</span>
                        <button class="delete-btn" onclick="handleDeleteFood('${food.id}')">&times;</button>
                    </div>
                `;
            }
            
            /**
             * Renderiza los objetivos de la semana actual (Sin cambios)
             */
            function renderWeeklyObjectives() {
                objectiveListContainer.innerHTML = ''; 
                if (objectives.length === 0) {
                    objectiveListContainer.innerHTML = '<p>No hay objetivos para esta semana.</p>';
                    return;
                }
                objectives.forEach(obj => {
                    const objEl = document.createElement('div');
                    objEl.classList.add('objective-item');
                    const checked = obj.completed ? 'checked' : '';
                    const completedClass = obj.completed ? 'completed' : '';
                    objEl.innerHTML = `
                        <input type="checkbox" id="obj-${obj.id}" ${checked} onchange="handleToggleObjective('${obj.id}')">
                        <span class="objective-text ${completedClass}">${escapeHTML(obj.name)}</span>
                        <button class="delete-btn" onclick="handleDeleteObjective('${obj.id}')">&times;</button>
                    `;
                    objectiveListContainer.appendChild(objEl);
                });
            }

            /**
             * NUEVO: Renderiza las tareas sin fecha (pendientes)
             */
            function renderPendingTasks() {
                const pendingTasks = tasks.filter(task => !task.date && task.type === 'Tarea');
                
                pendingTasksListContainer.innerHTML = ''; 

                if (pendingTasks.length === 0) {
                    pendingTasksListContainer.innerHTML = '<p>No hay tareas pendientes.</p>';
                    return;
                }

                pendingTasks.forEach(task => {
                    pendingTasksListContainer.appendChild(createTaskCard(task)); // Usa la función helper
                });
            }
            
            /**
             * NUEVO: Helper unificado para crear tarjetas de Tarea/Evento
             */
            function createTaskCard(task) {
                const taskEl = document.createElement('div');
                taskEl.classList.add('task-item');
                taskEl.setAttribute('data-type', task.type);

                // Lógica de color de borde
                let defaultColor = (task.type === 'Evento') ? 'var(--primary-color)' : 'var(--secondary-color)';
                let borderColor = defaultColor;
                if (task.tags && task.tags.length > 0) {
                    borderColor = getTagColor(task.tags[0]);
                }
                taskEl.style.borderLeftColor = borderColor;

                // Lógica de etiquetas
                let tagsHTML = '';
                if (task.tags && task.tags.length > 0) {
                    tagsHTML = '<div class="task-tags-list">';
                    task.tags.forEach(tag => {
                        const color = getTagColor(tag);
                        tagsHTML += `<span class="tag-pill" style="background-color: ${color};">${escapeHTML(tag)}</span>`;
                    });
                    tagsHTML += '</div>';
                }
                
                // Muestra la hora solo si existe
                const timeHTML = task.time ? `<span class="task-time">${escapeHTML(task.time)}</span>` : '';

                taskEl.innerHTML = `
                    <div class="task-header">
                        <span class="task-title">${escapeHTML(task.title)}</span>
                        ${timeHTML}
                    </div>
                    ${tagsHTML}
                    ${task.description ? `<p class="task-description">${escapeHTML(task.description)}</p>` : ''}
                    <div class="task-details">
                        ${task.location ? `<span><strong>Lugar:</strong> ${escapeHTML(task.location)}</span>` : ''}
                    </div>
                    <div class="task-actions">
                        <button class="action-btn btn-secondary" onclick="handleEditTask('${task.id}')">Editar</button>
                        <button class="action-btn btn-danger" onclick="handleDeleteTask('${task.id}')">Eliminar</button>
                    </div>
                `;
                return taskEl;
            }


            // --- 5. Manejo de Modales ---
            function openModal(modal) {
                modal.style.display = 'flex';
            }

            function closeModal(modal) {
                modal.style.display = 'none';
                resetTaskForm();
                foodForm.reset(); 
                objectiveForm.reset(); 
            }

            openTaskModalBtn.addEventListener('click', () => {
                resetTaskForm(); 
                document.getElementById('task-modal-title').textContent = 'Añadir Tarea/Evento';
                openModal(taskModal);
            });
            openFoodModalBtn.addEventListener('click', () => openModal(foodModal));
            openObjectiveModalBtn.addEventListener('click', () => openModal(objectiveModal)); 

            closeModalBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const modal = document.getElementById(e.target.dataset.modalId);
                    closeModal(modal);
                });
            });

            modalOverlays.forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        closeModal(overlay);
                    }
                });
            });

            // --- 6. Manejo de Formularios ---

            // MODIFICADO: Lógica condicional (con required)
            taskTypeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const isEvent = e.target.value === 'Evento';
                    locationGroup.style.display = isEvent ? 'block' : 'none';
                    
                    // Eventos requieren fecha/hora, Tareas no
                    taskDateInput.required = isEvent;
                    taskTimeInput.required = isEvent;
                });
            });
            repeatCheck.addEventListener('change', (e) => {
                repeatOptionsGroup.style.display = e.target.checked ? 'block' : 'none';
            });

            // Lógica de Etiquetas (Sin cambios)
            tagInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const tagName = tagInput.value.trim().toLowerCase();
                    if (tagName && !selectedTags.has(tagName)) {
                        selectedTags.add(tagName);
                        renderTagPills();
                    }
                    tagInput.value = '';
                }
            });
            
            function getTagColor(tag) {
                if (TAG_COLORS[tag]) {
                    return TAG_COLORS[tag];
                }
                let hash = 0;
                for (let i = 0; i < tag.length; i++) {
                    hash = tag.charCodeAt(i) + ((hash << 5) - hash);
                }
                const index = Math.abs(hash) % DEFAULT_TAG_COLORS.length;
                return DEFAULT_TAG_COLORS[index];
            }

            function renderTagPills() {
                tagsContainer.innerHTML = '';
                selectedTags.forEach(tag => {
                    const pill = document.createElement('span');
                    pill.className = 'tag-pill';
                    pill.style.backgroundColor = getTagColor(tag);
                    pill.textContent = escapeHTML(tag);
                    const removeBtn = document.createElement('span');
                    removeBtn.className = 'tag-pill-remove';
                    removeBtn.textContent = '×';
                    removeBtn.onclick = () => {
                        selectedTags.delete(tag);
                        renderTagPills();
                    };
                    pill.appendChild(removeBtn);
                    tagsContainer.appendChild(pill);
                });
            }

            // MODIFICADO: Enviar formulario de Tarea (con lógica de fecha nula)
            taskForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const id = document.getElementById('task-id').value;
                const isRepeating = repeatCheck.checked && document.getElementById('task-repeat-frequency').value !== 'none';
                
                const taskDate = document.getElementById('task-date').value;
                const taskTime = document.getElementById('task-time').value;

                const taskData = {
                    title: document.getElementById('task-title').value,
                    type: document.querySelector('input[name="task-type"]:checked').value,
                    date: taskDate || null, 
                    time: taskTime || null, 
                    location: document.getElementById('task-location').value,
                    description: document.getElementById('task-description').value,
                    tags: Array.from(selectedTags), 
                    repeat: document.getElementById('task-repeat-frequency').value
                };

                try {
                    // Caso 1: Editando una tarea
                    if (id) {
                        await db.collection("tasks").doc(id).update(taskData);
                    
                    // Caso 2: Creando una tarea nueva, NO repetitiva O SIN FECHA
                    } else if (!isRepeating || !taskData.date) { 
                        taskData.repeat = 'none';
                        await db.collection("tasks").add(taskData);
                    
                    // Caso 3: Creando una NUEVA serie (solo si hay fecha)
                    } else { 
                        const batch = db.batch();
                        const seriesId = Date.now().toString();
                        const frequency = taskData.repeat;
                        const durationNum = parseInt(document.getElementById('repeat-duration-number').value, 10);
                        const durationUnit = document.getElementById('repeat-duration-unit').value;
                        
                        let startDate = new Date(taskData.date + 'T' + taskData.time);
                        let endDate = new Date(startDate);
                        
                        if (durationUnit === 'días') endDate.setDate(endDate.getDate() + durationNum);
                        if (durationUnit === 'semanas') endDate.setDate(endDate.getDate() + (durationNum * 7));
                        if (durationUnit === 'meses') endDate.setMonth(endDate.getMonth() + durationNum);
                        if (durationUnit === 'años') endDate.setFullYear(endDate.getFullYear() + durationNum);
                        
                        let currentLoopDate = new Date(startDate);
                        
                        while (currentLoopDate <= endDate) {
                            const newTask = { ...taskData };
                            newTask.date = toISODateString(currentLoopDate);
                            newTask.time = currentLoopDate.toTimeString().substring(0, 5);
                            newTask.seriesId = seriesId; 
                            newTask.repeat = 'none';     
                            
                            const docRef = db.collection("tasks").doc(); 
                            batch.set(docRef, newTask);
                            
                            if (frequency === 'daily') currentLoopDate.setDate(currentLoopDate.getDate() + 1);
                            if (frequency === 'weekly') currentLoopDate.setDate(currentLoopDate.getDate() + 7);
                            if (frequency === 'monthly') currentLoopDate.setMonth(currentLoopDate.getMonth() + 1);
                            if (frequency === 'annual') currentLoopDate.setFullYear(currentLoopDate.getFullYear() + 1);
                        }
                        
                        await batch.commit();
                    }
                    
                    closeModal(taskModal); 
                    
                } catch (error) {
                    console.error("Error al guardar la tarea(s): ", error);
                }
            });

            // MODIFICADO: Resetea el formulario de tareas (y los required)
            function resetTaskForm() {
                taskForm.reset();
                document.getElementById('task-id').value = '';
                document.getElementById('task-modal-title').textContent = 'Añadir Tarea/Evento';
                locationGroup.style.display = 'none';
                repeatOptionsGroup.style.display = 'none'; 
                
                taskDateInput.required = false;
                taskTimeInput.required = false;
                
                selectedTags.clear();
                renderTagPills();
            }

            // Enviar formulario de Comida (Sin cambios)
            foodForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newFood = {
                    name: document.getElementById('food-name').value,
                    date: document.getElementById('food-date').value,
                    mealType: document.getElementById('food-meal-type').value
                };
                try {
                    const query = db.collection("foodPlan")
                        .where("date", "==", newFood.date)
                        .where("mealType", "==", newFood.mealType);
                    const querySnapshot = await query.get();
                    if (querySnapshot.empty) {
                        await db.collection("foodPlan").add(newFood);
                    } else {
                        const docId = querySnapshot.docs[0].id;
                        await db.collection("foodPlan").doc(docId).update(newFood);
                    }
                    closeModal(foodModal);
                } catch (error) {
                    console.error("Error al guardar la comida: ", error);
                }
            });
            
            // Enviar formulario de Objetivos (Sin cambios)
            objectiveForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const objectiveName = document.getElementById('objective-name').value;
                if (!objectiveName.trim()) return; 
                const newObjective = {
                    name: objectiveName,
                    completed: false,
                    weekId: getWeekId(new Date()) 
                };
                try {
                    await db.collection("objectives").add(newObjective);
                    closeModal(objectiveModal);
                } catch (error) {
                    console.error("Error al guardar el objetivo: ", error);
                }
            });

            // --- 7. Navegación del Calendario (Sin cambios) ---
            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderMonthlyCalendar();
            });
            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderMonthlyCalendar();
            });

            // --- 8. Acciones (Editar/Eliminar) ---
            
            // Eliminar Tarea (Sin cambios)
            window.handleDeleteTask = async (id) => {
                if (confirm('¿Estás seguro de que deseas eliminar esta tarea?')) {
                    try {
                        await db.collection("tasks").doc(id).delete();
                    } catch (error) {
                        console.error("Error al eliminar la tarea: ", error);
                    }
                }
            };

            // MODIFICADO: Editar Tarea (maneja fechas nulas y 'required')
            window.handleEditTask = (id) => {
                const task = tasks.find(task => task.id === id);
                if (!task) return;
                
                document.getElementById('task-id').value = task.id; 
                document.getElementById('task-modal-title').textContent = 'Editar Tarea/Evento';
                document.getElementById('task-title').value = task.title;
                
                const isEvent = task.type === 'Evento';
                document.querySelector(`input[name="task-type"][value="${task.type}"]`).checked = true;
                taskDateInput.required = isEvent;
                taskTimeInput.required = isEvent;
                
                document.getElementById('task-date').value = task.date || '';
                document.getElementById('task-time').value = task.time || '';
                document.getElementById('task-description').value = task.description;
                
                locationGroup.style.display = isEvent ? 'block' : 'none';
                if (isEvent) {
                    document.getElementById('task-location').value = task.location;
                }
                
                const isRepeating = task.repeat && task.repeat !== 'none';
                repeatCheck.checked = isRepeating;
                repeatOptionsGroup.style.display = isRepeating ? 'block' : 'none';
                if (isRepeating) {
                    document.getElementById('task-repeat-frequency').value = task.repeat;
                }

                selectedTags.clear();
                if (task.tags && task.tags.length > 0) {
                    task.tags.forEach(tag => selectedTags.add(tag));
                }
                renderTagPills(); 
                
                openModal(taskModal);
            };

            // Acciones de Comida y Objetivos (Sin cambios)
            window.handleDeleteFood = async (id) => {
                try {
                    await db.collection("foodPlan").doc(id).delete();
                } catch (error) {
                    console.error("Error al eliminar la comida: ", error);
                }
            };
            
            window.handleToggleObjective = async (id) => {
                const objective = objectives.find(obj => obj.id === id);
                if (objective) {
                    const newCompletedState = !objective.completed;
                    try {
                        await db.collection("objectives").doc(id).update({
                            completed: newCompletedState
                        });
                    } catch (error) {
                        console.error("Error al actualizar el objetivo: ", error);
                    }
                }
            };

            window.handleDeleteObjective = async (id) => {
                try {
                    await db.collection("objectives").doc(id).delete();
                } catch (error) {
                    console.error("Error al eliminar el objetivo: ", error);
                }
            };


            // --- 9. Funciones Utilitarias (Sin cambios) ---
            
            function toISODateString(date) {
                return new Date(date.getTime() - (date.getTimezoneOffset() * 60000))
                    .toISOString()
                    .split('T')[0];
            }
            
            function getWeekId(date) {
                const d = new Date(date);
                d.setHours(0, 0, 0, 0);
                const dayOfWeek = d.getDay();
                d.setDate(d.getDate() - dayOfWeek); 
                return toISODateString(d);
            }

            function escapeHTML(str) {
                if (!str) return '';
                return str.replace(/[&<>"']/g, (match) => {
                    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                    return map[match];
                });
            }

            // --- 10. Consideración Futura sobre Autenticación (Sin cambios) ---
            /* ... */

            // --- 11. Inicialización ---
            
            listenForTasks();
            listenForFood();
            listenForObjectives();
            
            renderMonthlyCalendar();
            renderFoodCalendar();
            renderWeeklyObjectives();
            renderPendingTasks(); // MODIFICADO: Llama al nuevo render
        });
    </script>
</body>
</html>
